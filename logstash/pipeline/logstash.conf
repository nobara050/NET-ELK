input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Parse timestamp from Serilog if present, otherwise logstash auto-assigns @timestamp
  if [Timestamp] {
    date {
      match => [ "Timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSS" ]
      target => "@timestamp"
      remove_field => [ "Timestamp" ]
    }
  }

  # Enrich and tag log levels
  if [Level] {
    mutate {
      add_field => { "log_level" => "%{Level}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "app-logs-%{+YYYY.MM.dd}"
  }
  # Also print to stdout for easy debugging in docker logs
  stdout {
    codec => rubydebug
  }
}
